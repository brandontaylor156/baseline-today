name: CI

on:
  push:
  pull_request:

env:
  # Public by design (shipped to every browser); RLS protects the data. Needed to prerender pages.
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  check:
    name: Typecheck, lint, unit tests, build, browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  isolation:
    name: Database tests (RLS isolation, sync integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Throwaway local Supabase with our migrations applied; never touches the real project.
      - run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
      - run: scripts/test-isolation.sh
      - name: Sync integration tests (fake provider, local Supabase)
        run: |
          eval "$(npx supabase status -o env)"
          export INTEGRATION_SUPABASE_URL="$API_URL"
          export INTEGRATION_SUPABASE_KEY="${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          npm run test:integration
